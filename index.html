<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>前田真実 | Mami Maeda — Career Consultant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+JP:wght@300;400;500;600&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a1a;
    --ink-soft: #4a4a4a;
    --paper: #fafaf8;
    --paper-alt: #f0efec;
    --line: #d8d6d0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', 'Noto Serif JP', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 16px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border: 1px solid var(--line);
    padding: 64px 44px 44px;
    position: relative;
    text-align: center;
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.9s cubic-bezier(.22,.61,.36,1) forwards;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.15);
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  .card::before {
    content: "";
    position: absolute;
    top: 14px; left: 14px; right: 14px; bottom: 14px;
    border: 1px solid var(--line);
    pointer-events: none;
  }

  .avatar {
    width: 108px;
    height: 108px;
    margin: 0 auto 28px;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid var(--ink);
    box-shadow: 0 0 0 5px #fff, 0 0 0 6px var(--line);
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .name-jp {
    font-family: 'Noto Serif JP', serif;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--ink);
  }

  .name-en {
    margin-top: 8px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .divider {
    width: 36px;
    height: 1px;
    background: var(--ink);
    margin: 22px auto;
    opacity: 0.5;
  }

  .title {
    font-size: 13.5px;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
    font-weight: 400;
  }

  .title::after {
    content: "Career Consultant";
    display: block;
    margin-top: 6px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 12.5px;
    letter-spacing: 0.22em;
    color: #9a9890;
    text-transform: uppercase;
  }

  .contact {
    margin-top: 40px;
    padding-top: 28px;
    border-top: 1px solid var(--paper-alt);
  }

  .contact a {
    display: inline-block;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    letter-spacing: 0.04em;
    color: var(--ink);
    text-decoration: none;
    padding: 11px 26px;
    border: 1px solid var(--ink);
    transition: background 0.25s ease, color 0.25s ease;
  }

  .contact a:hover {
    background: var(--ink);
    color: var(--paper);
  }

  .domain {
    margin-top: 30px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #b3b1aa;
  }

  @media (max-width: 380px) {
    .card { padding: 52px 28px 34px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="avatar">
      <img src="mami-avatar.jpg" alt="前田真実">
    </div>

    <div class="name-jp">前田&nbsp;真実</div>
    <div class="name-en">Mami&nbsp;Maeda</div>

    <div class="divider"></div>

    <div class="title">キャリアコンサルタント</div>

    <div class="contact">
      <a href="mailto:zhenshi0418@gmail.com">zhenshi0418@gmail.com</a>
    </div>

    <div class="domain">mamimaeda.com</div>
  </div>

</body>
</html>
