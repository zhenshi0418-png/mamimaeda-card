<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>前田真実 | Mami Maeda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ece6d9;
    --paper: #f6f2e9;
    --ink: #34302a;
    --ink-soft: #837a6a;
    --line: #cdc3ac;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 56px 40px 44px;
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.7s ease forwards;
  }

  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .avatar {
    width: 112px;
    height: 112px;
    margin: 0 auto 28px;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid var(--line);
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .name-jp {
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 700;
    font-size: 23px;
    letter-spacing: 0.08em;
    color: var(--ink);
  }

  .name-en {
    margin-top: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .divider {
    width: 28px;
    height: 1px;
    margin: 26px auto;
    background: var(--ink-soft);
  }

  .contact {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .contact a {
    display: inline-block;
    width: 100%;
    max-width: 260px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 13.5px;
    letter-spacing: 0.03em;
    color: var(--ink);
    text-decoration: none;
    padding: 12px 20px;
    border: 1px solid var(--ink-soft);
    transition: background 0.2s ease, color 0.2s ease;
  }

  .contact a:hover {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .domain {
    margin-top: 30px;
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  @media (max-width: 380px) {
    .card { padding: 46px 28px 34px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="avatar">
      <img src="mami-avatar-cat.jpg" alt="前田真実">
    </div>

    <div class="name-jp">前田&nbsp;真実</div>
    <div class="name-en">Mami&nbsp;Maeda</div>

    <div class="divider"></div>

    <div class="contact">
      <a href="mailto:zhenshi0418@gmail.com">zhenshi0418@gmail.com</a>
      <a href="tel:+819058563215">+81 90-5856-3215</a>
      <a href="https://wa.me/819058563215" target="_blank" rel="noopener">WhatsAppで連絡する</a>
    </div>

    <div class="domain">mamimaeda.com</div>
  </div>

</body>
</html>
